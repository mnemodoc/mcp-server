# Required — there is no default. `mnemodoc-server init` writes this section
# from the documentation directories it actually finds in the project.
paths:
  - doc/claude/
  - app/

# exclude:
#   - "**/templates/**"

ollama:
  host: http://localhost:11434
  model: nomic-embed-text
  timeout: 30
  batch_size: 10

search:
  top_k: 5
  mode: hybrid          # hybrid | semantic | keyword
  recency_days: 7
  recency_boost: 0.1    # multiplicative: recent files score ×(1 + boost)
  keyword_weight: 0.3   # weight of keyword vs semantic (1.0) in hybrid fusion
  # backend: vec0       # semantic KNN backend: vec0 (embedded, default) | qdrant (opt-in)

# Opt-in Qdrant backend (required when search.backend: qdrant). SQLite stays the
# source of truth; Qdrant is a best-effort, rebuildable KNN index keyed by chunk id.
# qdrant:
#   url: https://my-qdrant:6333   # Qdrant endpoint (api-key header auth)
#   api_key:                      # optional; or env QDRANT_API_KEY
#   collection:                   # optional; default = project key (basename-hash)

server:
  sse_host: 127.0.0.1 # bind address for SSE; the endpoint is UNAUTHENTICATED — use 0.0.0.0 only to expose it deliberately
  sse_port: 8765
  log_file: stderr    # stderr | stdout | /path/to/file.log
  log_level: info     # trace | debug | info | warn | error | fatal | off
  daemon: true        # false → serve --stdio runs standalone (no per-project background daemon)
  daemon_idle_timeout: 600  # seconds of inactivity before the daemon self-exits (>= 1)
  daemon_watch: true        # live re-index changed files while the daemon runs (polling)
  daemon_watch_interval: 1  # poll interval in seconds (>= 1)

db:
  # default: .mnemodoc/index.db, beside this config file
  #   (the directory also holds the WAL files and the daemon socket/lock, and gets
  #    a self-ignoring .gitignore so none of it can be committed by accident)
  # path: /custom/path/to/index.db

index:
  concurrency: 4      # parallel files indexed at once (>= 1)
  pdf: false          # opt-in PDF indexing; requires `pdftotext` in PATH, skips PDFs otherwise
  max_file_size: 10485760  # bytes; a document larger than this is skipped rather than read whole (0 disables)

# Chunking noise reduction (both default false → index byte-for-byte unchanged).
# Re-index after changing these (ingest_path / a full re-index) to take effect.
# chunking:
#   strip_link_only_lines: true              # drop pure breadcrumb lines (links + separators only); line-based markup (Markdown/Org/AsciiDoc/RST), no-op on DOM/Office formats
#   merge_preamble_into_first_section: true  # fold the pre-heading preamble into the first section chunk

# Contextual roles (optional): the get_project_context MCP tool and the `context`
# CLI command select which conventions Claude should adopt for the files/task/query
# at hand. Role file paths resolve relative to this config file, like `paths`.
# context:
#   default: doc/claude/roles/generalist.md  # fallback when no rule fires and there is no signal
#   min_query_score: 1     # rule score a prompt must reach for the query channel to inject; below it, silence
#   word_boundaries: true  # match when_task/when_query keywords as whole words, not inside longer ones
#   roles:
#     - file: doc/claude/roles/backend.md
#       description: Backend conventions — operations, persistence, policies  # used for the semantic tie-break
#       when_files: ["app/models/**", "app/policies/**"]  # glob triggers on the edited file paths
#       when_task:  ["implement", "refactor"]             # keyword triggers on the task kind
#       when_query: ["operation", "policy", "persistence"] # keyword triggers on the user query
#     - file: doc/claude/roles/frontend.md
#       description: Stimulus controllers, Turbo Streams, HAML views
#       when_files: ["app/frontend/**", "app/views/**"]
#       when_query: ["stimulus", "turbo", "view"]

# Files whose absolute path matches any of these globs are never indexed.
# exclude:
#   - "**/templates/**"
#   - "**/vendor/**"

# Contextual roles: which conventions the agent should adopt for the files,
# task or question at hand. Without this section the get_project_context tool
# is not offered at all, and the `context` command has nothing to select from.
# context:
#   default: doc/roles/generalist.md
#   roles:
#     - file: doc/roles/backend.md
#       description: Backend conventions   # used only for the semantic tie-break
#       when_files: ["app/models/**", "app/policies/**"]
#       when_task: ["implement", "refactor"]
#       when_query: ["operation", "policy"]

# The UserPromptSubmit hook (`prompt-hook`): whether a passage is injected
# before the agent reasons, and how many. The threshold is a cosine, so it is
# comparable across queries — re-calibrate it per corpus with `mise
# bench:tokens`, which reports the firing and false-firing rates.
# hook:
#   similarity_threshold: 0.515
#   margin_threshold: 0.02
#   max_passages: 3

# Semantic backend. vec0 (the default) is embedded and needs nothing; qdrant
# is opt-in and requires the section below.
# qdrant:
#   url: http://localhost:6333
#   api_key:            # or the QDRANT_API_KEY environment variable
#   collection:         # defaults to a per-project key

